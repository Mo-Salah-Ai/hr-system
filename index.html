<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --bg:#0f172a; --bg2:#0b1224; --surface:rgba(30,41,59,.62); --surface2:rgba(51,65,85,.45);
  --text:#e2e8f0; --muted:#94a3b8; --border:rgba(148,163,184,.18);
  --accent:#38bdf8; --accent2:#a78bfa; --ok:#34d399; --warn:#fbbf24; --err:#f87171;
  --glow:0 0 0 1px rgba(56,189,248,.25),0 8px 30px -8px rgba(56,189,248,.35);
  --shadow:0 10px 40px -12px rgba(0,0,0,.6);
  color-scheme:dark;
  --bgimg:radial-gradient(900px 500px at 85% -10%,rgba(56,189,248,.14),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(167,139,250,.13),transparent 60%);
}
[data-theme=light]{
  color-scheme:light;
  --bg:#f1f5f9; --bg2:#e8eef6; --surface:rgba(255,255,255,.78); --surface2:rgba(226,232,240,.6);
  --text:#0f172a; --muted:#64748b; --border:rgba(15,23,42,.1);
  --accent:#0284c7; --accent2:#7c3aed; --ok:#059669; --warn:#d97706; --err:#dc2626;
  --glow:0 0 0 1px rgba(2,132,199,.25),0 8px 24px -8px rgba(2,132,199,.35);
  --shadow:0 10px 30px -12px rgba(15,23,42,.25);
  --bgimg:radial-gradient(900px 500px at 85% -10%,rgba(2,132,199,.10),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(124,58,237,.08),transparent 60%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background-color:var(--bg)}
body{margin:0;background-color:var(--bg);background-image:var(--bgimg);background-attachment:fixed;color:var(--text);font-family:Inter,Cairo,system-ui,sans-serif;overscroll-behavior-y:contain}
[dir=rtl] body,[dir=rtl] input,[dir=rtl] textarea,[dir=rtl] select,[dir=rtl] button{font-family:Cairo,Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.ic{width:20px;height:20px;flex:none}
.glass{background:var(--surface);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--border)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;transition:transform .18s,box-shadow .18s,border-color .18s}
.card:hover{border-color:rgba(56,189,248,.4)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-weight:600;transition:transform .12s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.96)}
.btn:hover{border-color:rgba(56,189,248,.5)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;box-shadow:var(--glow)}
.btn.danger{background:rgba(248,113,113,.15);color:var(--err);border-color:rgba(248,113,113,.35)}
.btn.ghost{background:transparent}
.btn.icon{padding:9px;border-radius:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.inp{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);outline:none;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.18)}
.inp:disabled{opacity:.7}
textarea.inp{min-height:84px;resize:vertical}
select.inp{appearance:none}
.lab{display:block;font-size:12px;color:var(--muted);margin:0 2px 5px;font-weight:600;letter-spacing:.02em}
.req{color:var(--err);margin-inline-start:3px}
.fld{margin-bottom:14px;transition:opacity .2s}
.fld.off{display:none}
.fld.bad .inp,.fld.bad .chips{border-color:var(--err);animation:shake .3s}
.fld .err{color:var(--err);font-size:12px;margin-top:4px;min-height:0}
.calcv{padding:11px 13px;border-radius:12px;border:1px dashed var(--accent);background:rgba(56,189,248,.07);font-weight:700;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;border-radius:12px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-size:14px;transition:all .15s}
.chip:active{transform:scale(.94)}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:var(--glow)}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(56,189,248,.14);color:var(--accent)}
.switch{position:relative;width:48px;height:28px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.2s}
.switch.on{background:rgba(52,211,153,.25);border-color:var(--ok)}
.switch.on::after{inset-inline-start:23px;background:var(--ok)}
/* shell */
.shell{display:flex;min-height:100dvh}
.side{width:250px;flex:none;padding:18px 12px;position:sticky;top:0;height:100dvh;flex-direction:column;gap:6px;border-radius:0;border-width:0;border-inline-end:1px solid var(--border)}
.navi{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;cursor:pointer;color:var(--muted);font-weight:600;border:1px solid transparent;transition:all .15s;width:100%;background:none;text-align:start}
.navi:hover{background:var(--surface2);color:var(--text)}
.navi.on{background:rgba(56,189,248,.12);color:var(--accent);border-color:rgba(56,189,248,.3);box-shadow:var(--glow)}
.navi .em{font-size:18px}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));border-width:0 0 1px 0;border-radius:0}
#main{flex:1;padding:14px;padding-bottom:150px;max-width:1200px;width:100%;margin:0 auto}
.bottom-nav{position:fixed;bottom:0;inset-inline:0;z-index:30;display:flex;gap:6px;overflow-x:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-width:1px 0 0 0;border-radius:0;scrollbar-width:none}
.bottom-nav::-webkit-scrollbar{display:none}
.bnav{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:68px;padding:6px 10px;border-radius:12px;font-size:11px;font-weight:600;color:var(--muted);background:none;border:1px solid transparent;cursor:pointer}
.bnav .em{font-size:20px}
.bnav.on{color:var(--accent);background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.3)}
@media(min-width:1024px){.bottom-nav{display:none}#main{padding-bottom:90px}}
#fab{position:fixed;z-index:40;inset-inline-end:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;border:0;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 30px -4px var(--accent),var(--shadow);transition:transform .15s}
#fab:active{transform:scale(.9) rotate(90deg)}
#fab .ic{width:28px;height:28px}
@media(min-width:1024px){#fab{bottom:28px}}
/* status pill */
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--border);white-space:nowrap}
.pill .d{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.pill.ok{color:var(--ok);background:rgba(52,211,153,.1)} .pill.warn{color:var(--warn);background:rgba(251,191,36,.12)}
.pill.err{color:var(--err);background:rgba(248,113,113,.12)} .pill.busy{color:var(--accent);background:rgba(56,189,248,.12)}
.pill.busy .d{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3;transform:scale(.7)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite}
/* list */
.swipe{position:relative;margin-bottom:10px;border-radius:16px;overflow:hidden;animation:rise .3s both}
.swipe-bg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 22px;border-radius:16px;color:#fff}
.swipe-bg .e{color:var(--ok)} .swipe-bg .x{color:var(--err)}
.swipe .card{position:relative;cursor:pointer;touch-action:pan-y;background:var(--bg2);}
[data-theme=light] .swipe .card{background:#fff}
.mk{background:rgba(56,189,248,.28);color:inherit;border-radius:3px;padding:0 1px}
.dotp{width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px var(--warn);display:inline-block}
table.t{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:14px}
table.t th{text-align:start;color:var(--muted);font-size:12px;padding:6px 12px;font-weight:600;white-space:nowrap}
table.t td{padding:11px 12px;background:var(--surface);border-block:1px solid var(--border)}
table.t td:first-child{border-inline-start:1px solid var(--border);border-radius:12px 0 0 12px}
table.t td:last-child{border-inline-end:1px solid var(--border);border-radius:0 12px 12px 0}
[dir=rtl] table.t td:first-child{border-radius:0 12px 12px 0} [dir=rtl] table.t td:last-child{border-radius:12px 0 0 12px}
table.t tr.row{cursor:pointer} table.t tr.row:hover td{background:var(--surface2)}
.sugg{position:absolute;inset-inline:0;top:100%;margin-top:6px;z-index:20;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.sugg button{display:block;width:100%;text-align:start;padding:10px 14px;background:none;border:0;cursor:pointer;border-bottom:1px solid var(--border)}
.sugg button:hover{background:var(--surface2)}
/* overlays */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(2,6,23,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.overlay.open{opacity:1}
.sheet{width:100%;max-width:560px;max-height:92dvh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);background:var(--bg2)}
.sheet.wide{max-width:900px}
.overlay.open .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--border);margin:9px auto 4px;flex:none;cursor:grab;touch-action:none}
.sheet-body{overflow:auto;padding:6px 18px 20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;min-height:0;flex:1}
@media(min-width:768px){.overlay{align-items:center}.sheet{border-radius:24px;max-height:88dvh}}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 14px}
.hd h3{margin:0;font-size:18px;font-weight:700}
#dlg{z-index:80}
/* toasts */
#toasts{position:fixed;z-index:100;top:calc(66px + env(safe-area-inset-top));inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:14px;max-width:440px;font-weight:600;font-size:14px;transform:translateY(-14px) scale(.96);opacity:0;transition:all .25s;background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow)}
.toast.show{transform:none;opacity:1}
.toast .dot{width:10px;height:10px;border-radius:50%;flex:none}
.toast.ok .dot{background:var(--ok);box-shadow:0 0 10px var(--ok)} .toast.warn .dot{background:var(--warn);box-shadow:0 0 10px var(--warn)} .toast.err .dot{background:var(--err);box-shadow:0 0 10px var(--err)}
.tbtn{margin-inline-start:8px;color:var(--accent);background:none;border:0;font-weight:700;cursor:pointer}
/* chat */
.chat{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px 12px;min-height:240px}
.msg{max-width:84%;padding:10px 14px;border-radius:18px;animation:rise .25s both;line-height:1.45;word-break:break-word}
.msg.bot{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);border-end-start-radius:6px}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-end-end-radius:6px}
.typing{display:inline-flex;gap:4px;padding:4px 0}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:pulse 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composer{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border);padding-top:10px}
.crow{display:flex;gap:8px;align-items:center}
/* file zone */
.dz{border:2px dashed var(--border);border-radius:14px;padding:16px;text-align:center;cursor:pointer;transition:all .2s;color:var(--muted)}
.dz.drag,.dz:hover{border-color:var(--accent);background:rgba(56,189,248,.07);color:var(--accent)}
.fi{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);font-size:13px}
.fi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.bar{height:5px;border-radius:9px;background:var(--border);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .15s}
/* admin */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:768px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:14px;border-radius:16px;position:relative;overflow:hidden}
.kpi b{display:block;font-size:28px;margin-top:4px}
.kpi small{color:var(--muted);font-weight:600}
.kpi::after{content:"";position:absolute;inset-inline-end:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:var(--c,var(--accent));opacity:.15;filter:blur(8px)}
.sub{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.sub button{flex:none}
.urow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.av{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;position:relative;flex:none}
.av .on{position:absolute;bottom:-3px;inset-inline-end:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg2);background:var(--muted)}
.av .on.y{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.badge{padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700;background:var(--surface2)}
.badge.create{color:var(--ok)}.badge.update{color:var(--accent)}.badge.delete,.badge.lockout,.badge.security_alert,.badge.login_fail,.badge.login_blocked{color:var(--err)}.badge.conflict{color:var(--warn)}
.alert{border:1px solid rgba(248,113,113,.4);background:rgba(248,113,113,.1);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start;animation:rise .3s both}
.pm{display:grid;grid-template-columns:1fr repeat(3,44px);gap:6px;align-items:center;font-size:13px}
.pm label.c{display:flex;justify-content:center}
.pm input{width:18px;height:18px;accent-color:var(--accent)}
.login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px}
.login .box{width:100%;max-width:400px;padding:28px;border-radius:26px;box-shadow:var(--shadow),var(--glow);animation:rise .5s both}
.logo{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 0 40px -6px var(--accent)}
.muted{color:var(--muted)}
.skeleton{height:68px;border-radius:16px;background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- responsive hardening (all screens) ---------- */
html,body{max-width:100%;overflow-x:hidden}
img,svg,canvas{max-width:100%}
.card,.kpi,.stat,.dw,.pill{min-width:0}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.tscroll table.t{min-width:560px}
table.aud{min-width:700px}
.urow>div{min-width:0}
.urow.wrap{flex-wrap:wrap;row-gap:4px}
.afilt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.afilt .afbtn{grid-column:span 2}
@media(min-width:768px){.afilt{grid-template-columns:repeat(4,minmax(0,1fr))}}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpi b{font-size:clamp(22px,6vw,30px);overflow:hidden;text-overflow:ellipsis}
.sheet-body{overflow-x:hidden}
.sheet-body .inp,.sheet-body select{max-width:100%}
@media(max-width:480px){
  .topbar{gap:4px;padding:8px 8px;padding-top:calc(8px + env(safe-area-inset-top))}
  .btn.icon{padding:7px}.btn{padding:9px 12px}
  #main{padding:10px 10px 150px}
  .sheet-body{padding:6px 14px 18px}
  .toast{max-width:94vw}.hd h3{font-size:16px}
  .pill{padding:6px 9px}
}
@media(max-width:360px){#syncBtn{display:none}}

/* ---------- personal dashboard ---------- */
.dhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.dhead .acts{display:flex;flex-wrap:wrap;gap:8px}
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.dw{grid-column:span 6;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:18px;position:relative;animation:rise .3s both;overflow:hidden}
.dw[data-s=s]{grid-column:span 3}.dw[data-s=m]{grid-column:span 6}.dw[data-s=l]{grid-column:span 12}
@media(max-width:1023px){.dw[data-s=s]{grid-column:span 4}}
@media(max-width:767px){.dw[data-s=s]{grid-column:span 6}.dw[data-s=m],.dw[data-s=l]{grid-column:span 12}}
.dw.edit{outline:1.5px dashed var(--accent);outline-offset:-2px}
.dw-h{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:28px}
.dw-t{font-size:13px;color:var(--muted);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dw-tools{display:flex;gap:2px;flex:none}
.dw-tools .btn{padding:5px;border-radius:9px}
.dw-tools .ic{width:16px;height:16px}
.dclick{cursor:pointer}
.dbig{font-size:clamp(26px,7vw,38px);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.dsub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcols{display:flex;align-items:flex-end;gap:6px;height:160px;overflow-x:auto;padding-top:6px}
.dcol{flex:1 0 36px;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;cursor:pointer}

.dcol i{display:block;width:100%;max-width:46px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--accent),var(--accent2));min-height:3px;transition:height .4s}
.dcol span{font-size:10px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.hb{display:grid;grid-template-columns:minmax(56px,32%) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;margin:5px 0;cursor:pointer}
.hb .tr{height:9px;border-radius:9px;background:var(--surface2);overflow:hidden}

.hb>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donutw{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.donutw svg{width:min(150px,40vw);height:auto;flex:none;transform:rotate(-90deg)}
.leg{flex:1 1 120px;min-width:0;font-size:13px}
.leg div{display:flex;align-items:center;gap:7px;padding:3px 0;cursor:pointer;min-width:0}
.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.leg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg b{flex:none}
.linew svg{width:100%;height:130px;display:block}
.linew .ax{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);gap:8px}
.dlist .it{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;min-width:0}
.dlist .it b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.typeg{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px;margin-bottom:14px}
.typeg button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:14px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-size:12px;font-weight:700}
.typeg button span{font-size:22px}
.typeg button.on{border-color:var(--accent);background:rgba(56,189,248,.14);color:var(--accent);box-shadow:var(--glow)}
.wprev{border:1px dashed var(--border);border-radius:16px;padding:12px;margin:4px 0 14px;min-height:90px}
.pm{grid-template-columns:minmax(0,1fr) repeat(3,40px)}
.pm>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:768px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.alert>div{min-width:0}
.card{overflow-wrap:anywhere}
.topbar>div:first-child{flex:1 1 60px}
@media(max-width:420px){.topbar .btn.icon .ic{width:18px;height:18px}.topbar .btn.icon{padding:6px}.topbar .btn.icon b{display:none}.dcols{height:140px}.donutw{justify-content:flex-start}}
.wprev .dcols{height:120px}

/* ---------- login redesign ---------- */
.login-card{width:100%;max-width:880px;display:grid;grid-template-columns:1fr;border-radius:26px;overflow:hidden;box-shadow:var(--shadow),var(--glow);animation:rise .5s both}
@media(min-width:820px){.login-card{grid-template-columns:1.05fr 1fr}}
.login-side{display:none;padding:36px 32px;background:linear-gradient(155deg,rgba(56,189,248,.17),rgba(167,139,250,.15));border-inline-end:1px solid var(--border);flex-direction:column;gap:12px}
@media(min-width:820px){.login-side{display:flex}}
[dir=rtl] .login-side{border-inline-end:0;border-inline-start:1px solid var(--border)}
.login-side h1{margin:0;font-size:29px;font-weight:800}
.login-form{padding:32px 26px;background:var(--bg2)}
@media(max-width:819px){.login-form{padding-top:44px}}
.feat{display:flex;gap:11px;align-items:center;font-size:13.5px;color:var(--muted)}
.feat .fi-ic{width:34px;height:34px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(56,189,248,.13);color:var(--accent)}
.logo.sm{width:40px;height:40px;font-size:20px;border-radius:14px;flex:none}
.logo.lg{width:66px;height:66px;font-size:33px;border-radius:20px}
.logoimg{width:66px;height:66px;object-fit:contain;border-radius:16px;flex:none}
.logoimg.sm{width:40px;height:40px;border-radius:12px}
/* ---------- dashboard ---------- */
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:13px;padding:9px 12px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat b{font-size:20px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
/* segmented control */
.seg{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:13px;padding:3px;gap:3px;flex:none}
.segbtn{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;border:0;background:none;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;transition:all .15s}
.segbtn .ic{width:16px;height:16px}
.segbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:var(--glow)}
/* ---------- splash screen (premium) ---------- */
#splash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:var(--bg);font-family:Cairo,Inter,system-ui,sans-serif;transition:opacity .8s ease,visibility .8s,transform .8s cubic-bezier(.4,0,.2,1)}
#splash.hide{opacity:0;visibility:hidden;transform:scale(1.05)}
.sp-aurora{position:absolute;inset:0;filter:blur(70px);opacity:.85;pointer-events:none}
.sp-aurora i{position:absolute;border-radius:50%;animation:sp-drift 11s ease-in-out infinite alternate}
.sp-aurora i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:radial-gradient(circle,var(--accent),transparent 65%);opacity:.38}
.sp-aurora i:nth-child(2){width:42vmax;height:42vmax;right:-14vmax;bottom:-16vmax;background:radial-gradient(circle,var(--accent2),transparent 65%);opacity:.38;animation-delay:-4s}
.sp-aurora i:nth-child(3){width:30vmax;height:30vmax;left:55%;top:8%;background:radial-gradient(circle,var(--ok),transparent 65%);opacity:.14;animation-delay:-7s}
@keyframes sp-drift{from{transform:translate(0,0) scale(1)}to{transform:translate(6vmax,4vmax) scale(1.18)}}
.sp-grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(circle at 50% 46%,#000 0,transparent 68%);mask-image:radial-gradient(circle at 50% 46%,#000 0,transparent 68%);opacity:.55}
.sp-dots{position:absolute;inset:0;pointer-events:none}
.sp-dots b{position:absolute;bottom:-12px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:var(--accent);box-shadow:0 0 12px 2px var(--accent);opacity:0;animation:sp-rise var(--d) linear infinite;animation-delay:var(--l)}
@keyframes sp-rise{0%{transform:translateY(0);opacity:0}12%{opacity:.8}85%{opacity:.5}100%{transform:translateY(-105vh);opacity:0}}
.sp-core{position:relative;width:176px;height:176px;display:flex;align-items:center;justify-content:center;z-index:1}
.sp-halo{position:absolute;inset:-34px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0,transparent 66%);opacity:.3;animation:sp-pulse 2.6s ease-in-out infinite}
@keyframes sp-pulse{50%{transform:scale(1.15);opacity:.5}}
.sp-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,var(--accent) 85%,var(--accent2) 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:spin 1.6s linear infinite}
.sp-ring.r2{inset:-18px;opacity:.55;animation-duration:2.8s;animation-direction:reverse;background:conic-gradient(from 90deg,transparent 0 60%,var(--accent2) 100%)}
.sp-ring.r3{inset:18px;opacity:.35;animation-duration:4.2s;background:conic-gradient(from 180deg,transparent 0 70%,var(--accent) 100%)}
.sp-orbit{position:absolute;inset:-18px;animation:spin 3.4s linear infinite}
.sp-orbit::after{content:"";position:absolute;top:-4px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#fff;box-shadow:0 0 16px 4px var(--accent)}
.sp-logo{position:relative;overflow:hidden;width:96px;height:96px;border-radius:30px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:48px;color:#fff;box-shadow:0 24px 60px -14px var(--accent),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -12px 24px rgba(0,0,0,.18);animation:sp-pop 1s cubic-bezier(.2,1.4,.3,1) both,sp-float 3.4s ease-in-out 1s infinite}
.sp-logo::after{content:"";position:absolute;top:-40%;left:-60%;width:40%;height:180%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:rotate(20deg);animation:sp-sweep 2.8s ease-in-out 1s infinite}
@keyframes sp-pop{from{transform:scale(.3) rotate(-18deg);opacity:0}to{transform:none;opacity:1}}
@keyframes sp-float{50%{transform:translateY(-6px)}}
@keyframes sp-sweep{0%{left:-60%}55%,100%{left:140%}}
.sp-name{position:relative;z-index:1;margin-top:34px;font-size:36px;font-weight:800;letter-spacing:.02em;background:linear-gradient(90deg,var(--text),var(--accent),var(--accent2),var(--text));background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sp-shine 2.6s linear infinite,sp-in .9s .25s both}
@keyframes sp-shine{to{background-position:-220% 0}}
@keyframes sp-in{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.sp-tag{position:relative;z-index:1;margin-top:6px;font-size:14px;color:var(--muted);letter-spacing:.04em;animation:sp-in .9s .45s both}
.sp-prog{position:relative;z-index:1;margin-top:34px;width:min(260px,70vw);animation:sp-in .9s .65s both}
.sp-bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)}
.sp-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 14px var(--accent);transition:width .25s ease;position:relative;overflow:hidden}
.sp-bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:sp-load 1.2s ease-in-out infinite}
@keyframes sp-load{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.sp-meta{display:flex;justify-content:space-between;gap:10px;margin-top:9px;font-size:12px;color:var(--muted)}
.sp-meta b{color:var(--accent);font-variant-numeric:tabular-nums;font-weight:700}
.sp-foot{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));z-index:1;font-size:11.5px;color:var(--muted);letter-spacing:.05em;opacity:.8;display:flex;gap:14px;animation:sp-in 1s .9s both}
@media(prefers-reduced-motion:reduce){.sp-aurora i,.sp-dots b,.sp-ring,.sp-orbit,.sp-halo,.sp-logo,.sp-logo::after,.sp-name{animation:none!important}}
</style>
